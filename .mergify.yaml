scopes:
  source:
    files:
      critical:
        include:
          - "security/**"

pull_request_rules:
  - name: VM2 config-order critical merge
    conditions:
      - scope = critical
      - check-success = vm2-config-order-gate
      - label = VM2_V26_RELEASE_1005
      - -mergify-configuration-changed
    actions:
      merge:
        method: merge
